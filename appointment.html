<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Powerlifting coaching appointment page">
    <meta name="author" content="Ziye Zhou">

    <title>Book Appointment - MN Powerlifting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="css/homepage.css" rel="stylesheet">
    <link href="css/service.css" rel="stylesheet">
    <link href="css/appointment.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=Michroma&family=Squada+One&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark-green">
        <div class="container">

            <a class="navbar-brand brand-block" href="service.html">
                <span class="brand-name">MN Powerlifting</span>
                <span class="brand-subtitle">Your Professional Coaching Service</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">About Me</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="service.html">Service Site</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="appointment.html">Book Appointment</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="faq.html">FAQ</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Appointment Form Section -->
    <section class="appointment-section">
        <div class="appointment-box">

            <h1 class="appointment-title">Book Appointment</h1>

            <form id="appointmentForm">

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="mb-3">
                    <label for="emailAddress" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="emailAddress" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label for="phoneNumber" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phoneNumber" placeholder="Enter your phone number">
                </div>

                <div class="mb-3">
                    <label for="serviceType" class="form-label">Service</label>
                    <select class="form-control" id="serviceType">
                        <option>Choose the type of service you'd like to consult</option>
                        <option>Private Coaching</option>
                        <option>Personalized Training Plan</option>
                        <option>Nutrition Plan</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="appointmentDate" class="form-label">Available Date</label>
                    <input type="date" class="form-control" id="appointmentDate">
                </div>

                <div class="mb-3">
                    <label for="appointmentTime" class="form-label">Select an Appointment Time</label>
                    <select class="form-control" id="appointmentTime">
                        <option>Choose a time</option>
                        <option>9:00 AM</option>
                        <option>11:00 AM</option>
                        <option>2:00 PM</option>
                        <option>5:00 PM</option>
                        <option>8:00 PM</option>
                    </select>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="termsCheck">
                    <label class="form-check-label" for="termsCheck">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <button type="submit" class="appointment-submit-btn">
                    Submit
                </button>

            </form>

            <p id="appointmentMessage" class="appointment-message d-none">
                Your appointment request has been submitted. A confirmation has been sent to your email.
            </p>

        </div>
    </section>

    <footer class="site-footer">
        <p>Designed by Ziye Zhou</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>

</body>
</html>
