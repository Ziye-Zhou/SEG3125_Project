<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="E-commerce case study">
    <meta name="author" content="Ziye Zhou">

    <title>MN Powerlifting E-Commerce Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/homepage.css" rel="stylesheet">
    <link href="css/ecommerce.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=Michroma&family=Squada+One&display=swap" rel="stylesheet">
    </head>

<body>

    <!-- Portfolio Navigation: same structure as the Service Site -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark-green">
        <div class="container">

            <a class="navbar-brand brand-block" href="index.html">
                <span class="brand-name">MN Powerlifting</span>
                <span class="brand-subtitle">Your Professional Coaching Service</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">

                    <!-- About Me Dropdown -->
                    <li class="nav-item dropdown portfolio-nav-item">

                        <a
                            class="nav-link dropdown-toggle portfolio-nav-dropdown"
                            href="index.html"
                            id="aboutMeDropdown"
                            aria-expanded="false"
                        >
                            About Me
                        </a>

                        <ul
                            class="dropdown-menu portfolio-dropdown-menu"
                            aria-labelledby="aboutMeDropdown"
                        >
                            <li>
                                <a
                                    class="dropdown-item"
                                    href="service.html"
                                >
                                    Service Site
                                </a>
                            </li>

                            <li>
                                <a
                                    class="dropdown-item"
                                    href="game.html"
                                >
                                    Memory Game
                                </a>
                            </li>


                            <li>
                                <a
                                    class="dropdown-item"
                                    href="analytics.html"
                                >
                                    Analytics Site
                                </a>
                            </li>
                        </ul>

                    </li>

                    <li class="nav-item">
                        <button class="nav-link active top-store-nav" type="button"
                            onclick="window.dispatchEvent(new CustomEvent('mn-store-nav', { detail: 'home' }))">
                            Store
                        </button>
                    </li>

                    <li class="nav-item">
                        <button class="nav-link top-store-nav" type="button"
                            onclick="window.dispatchEvent(new CustomEvent('mn-store-nav', { detail: 'cart' }))">
                            Cart
                        </button>
                    </li>

                    <li class="nav-item">
                        <button class="nav-link top-store-nav" type="button"
                            onclick="window.dispatchEvent(new CustomEvent('mn-store-nav', { detail: 'history' }))">
                            Purchase History
                        </button>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <noscript>You need to enable JavaScript to use this e-commerce prototype.</noscript>

    <!-- React renders the e-commerce experience here. -->
    <main id="ecommerce-root"></main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Designed by Ziye Zhou</p>
    </footer>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React framework loaded by CDN so this page works inside the existing static portfolio. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React e-commerce app -->
    <script type="text/babel" src="js/ecommerce-react.js"></script>
</body>
</html>
