<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Interactive bilingual powerlifting analytics site"
    >

    <meta
        name="author"
        content="Ziye Zhou"
    >

    <title>MN Powerlifting Analytics</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Existing portfolio CSS -->
    <link
        href="css/homepage.css"
        rel="stylesheet"
    >

    <!-- Analytics CSS -->
    <link
        href="css/analytics.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Michroma&family=Source+Sans+3:wght@400;600;700;800;900&family=Squada+One&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Portfolio Navigation -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark-green">

        <div class="container">

            <a
                class="navbar-brand brand-block"
                href="index.html"
            >
                <span class="brand-name">
                    MN Powerlifting
                </span>

                <span class="brand-subtitle">
                    Your Professional Coaching Service
                </span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarResponsive"
            >
                <ul class="navbar-nav ms-auto">

                    <!-- About Me Dropdown -->
                    <li class="nav-item dropdown portfolio-nav-item">

                        <a
                            class="nav-link dropdown-toggle portfolio-nav-dropdown"
                            href="index.html"
                            id="aboutMeDropdown"
                            aria-expanded="false"
                        >
                            About Me
                        </a>

                        <ul
                            class="dropdown-menu dropdown-menu-end portfolio-dropdown-menu"
                            aria-labelledby="aboutMeDropdown"
                        >
                            <li>
                                <a
                                    class="dropdown-item"
                                    href="service.html"
                                >
                                    Service Site
                                </a>
                            </li>

                            <li>
                                <a
                                    class="dropdown-item"
                                    href="jeu.html"
                                >
                                    Memory Game
                                </a>
                            </li>

                            <li>
                                <a
                                    class="dropdown-item"
                                    href="ecommerce.html"
                                >
                                    E-commerce Site
                                </a>
                            </li>

                        </ul>

                    </li>

                    <!-- Analytics -->
                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="analytics.html"
                            aria-current="page"
                        >
                            Analytics
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <noscript>
        You need to enable JavaScript to use this analytics site.
    </noscript>

    <!-- React App -->
    <main id="analytics-root"></main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Designed by Ziye Zhou</p>
    </footer>

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Chart.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>

    <!-- React -->
    <script
        crossorigin
        src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>

    <script
        crossorigin
        src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Babel -->
    <script
        src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>

    <!-- Analytics App -->
    <script
        type="text/babel"
        src="js/analytics-react.js"
    ></script>

</body>
</html>
